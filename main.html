
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script>
      // MindAR selalu meminta kamera tanpa resolusi, sehingga Chrome di Linux memilih YUYV 640x480.
      // Webcam DV20 mengirim frame YUYV yang ditandai rusak oleh driver uvcvideo, lalu dibuang Chrome,
      // jadi video tidak pernah mulai. Minta 1280x720 agar dipakai MJPEG yang frame-nya normal.
      // MindAR juga hanya menulis error kamera ke console dan layar loading tidak pernah hilang,
      // jadi tangkap error-nya dan tampilkan penyebabnya di layar.
      let cameraError = null;
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        const getUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
        navigator.mediaDevices.getUserMedia = (constraints) => {
          if (constraints && constraints.video) {
            const video = typeof constraints.video === "object" ? constraints.video : {};
            constraints = { ...constraints, video: { width: { ideal: 1280 }, height: { ideal: 720 }, ...video } };
          }
          return getUserMedia(constraints).catch((err) => { cameraError = err; throw err; });
        };
      }

      function cameraErrorMessage() {
        if (!window.isSecureContext) return "Halaman harus dibuka lewat https:// atau http://localhost, bukan http://<alamat-IP>.";
        if (!cameraError) return "Kamera tidak didukung di browser ini.";
        switch (cameraError.name) {
          case "NotAllowedError": return "Izin kamera ditolak. Klik ikon gembok di address bar, izinkan Kamera, lalu reload halaman.";
          case "NotFoundError":
          case "OverconstrainedError": return "Kamera tidak ditemukan.";
          case "NotReadableError": return "Kamera sedang dipakai aplikasi/tab lain (Zoom, OBS, Meet, dll). Tutup dulu, lalu reload.";
          default: return cameraError.name + ": " + cameraError.message;
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        document.querySelector("a-scene").addEventListener("arError", () => {
          document.querySelectorAll(".mindar-ui-loading").forEach((el) => el.classList.add("hidden"));
          const box = document.createElement("div");
          box.style.cssText = "position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#000c;color:#fff;font:16px sans-serif;text-align:center;z-index:10000";
          box.textContent = "Kamera gagal dibuka. " + cameraErrorMessage();
          document.body.appendChild(box);
        });
      });
    </script>
    <script>
      // Saat gambar target hilang dari kamera, MindAR hanya menyembunyikannya,
      // jadi cek dulu apakah elemen benar-benar sedang terlihat.
      function isShown(el) {
        for (let o = el.object3D; o; o = o.parent) if (!o.visible) return false;
        return true;
      }

      // Titik yang bisa diklik di sekitar model 3D. Isi pop-up diambil dari atribut
      // hotspot="title: ...; description: ...". Jangan pakai tanda ";" di dalam teks.
      AFRAME.registerComponent("hotspot", {
        schema: {
          title: { type: "string" },
          description: { type: "string" },
        },
        init() {
          this.el.setAttribute("geometry", { primitive: "sphere", radius: 0.05 });
          this.el.setAttribute("material", { shader: "flat", color: "#ff4d6d" });
          this.el.setAttribute("animation__pulse", { property: "scale", to: "1.3 1.3 1.3", dur: 600, easing: "easeInOutSine", loop: true, dir: "alternate" });
          this.el.addEventListener("click", () => {
            // Klik di akhir geseran/cubitan bukan tap, jangan buka pop-up.
            if (!isShown(this.el) || this.el.sceneEl.is("gesture-moved")) return;
            document.getElementById("hotspot-title").textContent = this.data.title;
            document.getElementById("hotspot-description").textContent = this.data.description;
            document.getElementById("hotspot-popup").hidden = false;
          });
        },
      });

      // Gestur untuk memutar dan memperbesar model:
      // - geser 1 jari / drag mouse: putar kiri-kanan dan atas-bawah, tetap berputar sebentar setelah dilepas
      // - cubit 2 jari / scroll mouse: zoom
      // Putaran dan zoom kembali ke awal setiap kali kartu terdeteksi lagi.
      AFRAME.registerComponent("model-gesture", {
        schema: {
          rotateSpeed: { default: 0.4 }, // derajat per piksel geseran
          maxTilt: { default: 80 }, // batas miring atas-bawah, dalam derajat
          minScale: { default: 0.5 },
          maxScale: { default: 3 },
        },
        init() {
          this.pointers = new Map();
          this.onDown = this.onDown.bind(this);
          this.onMove = this.onMove.bind(this);
          this.onUp = this.onUp.bind(this);
          this.onWheel = this.onWheel.bind(this);
          this.reset = this.reset.bind(this);
          // Event dari canvas naik ke a-scene; pop-up di luar a-scene tidak ikut tertangkap.
          const scene = this.el.sceneEl;
          scene.addEventListener("pointerdown", this.onDown);
          scene.addEventListener("pointermove", this.onMove);
          scene.addEventListener("pointerup", this.onUp);
          scene.addEventListener("pointercancel", this.onUp);
          scene.addEventListener("wheel", this.onWheel, { passive: false });
          this.target = this.el.closest("[mindar-image-target]");
          this.target.addEventListener("targetFound", this.reset);
          this.reset();
        },
        remove() {
          const scene = this.el.sceneEl;
          scene.removeEventListener("pointerdown", this.onDown);
          scene.removeEventListener("pointermove", this.onMove);
          scene.removeEventListener("pointerup", this.onUp);
          scene.removeEventListener("pointercancel", this.onUp);
          scene.removeEventListener("wheel", this.onWheel);
          this.target.removeEventListener("targetFound", this.reset);
        },
        reset() {
          this.rotation = { x: 0, y: 0 };
          this.velocity = { x: 0, y: 0 };
          this.scale = 1;
          this.apply();
        },
        apply() {
          const o = this.el.object3D;
          o.rotation.set(THREE.MathUtils.degToRad(this.rotation.x), THREE.MathUtils.degToRad(this.rotation.y), 0);
          o.scale.setScalar(this.scale);
        },
        rotate(rx, ry) {
          this.rotation.x = THREE.MathUtils.clamp(this.rotation.x + rx, -this.data.maxTilt, this.data.maxTilt);
          this.rotation.y += ry;
          this.apply();
        },
        zoom(factor) {
          this.scale = THREE.MathUtils.clamp(this.scale * factor, this.data.minScale, this.data.maxScale);
          this.apply();
        },
        pinchDistance() {
          const [a, b] = [...this.pointers.values()];
          return Math.hypot(a.x - b.x, a.y - b.y);
        },
        onDown(e) {
          if (this.pointers.size === 0) this.el.sceneEl.removeState("gesture-moved");
          if (!isShown(this.el)) return;
          this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, t: e.timeStamp });
          this.velocity = { x: 0, y: 0 };
          if (this.pointers.size === 1) {
            this.start = { x: e.clientX, y: e.clientY };
          } else if (this.pointers.size === 2) {
            this.pinch = { distance: this.pinchDistance(), scale: this.scale };
            this.el.sceneEl.addState("gesture-moved");
          }
        },
        onMove(e) {
          const prev = this.pointers.get(e.pointerId);
          if (!prev) return;
          // Tombol mouse dilepas di luar jendela: pointerup tidak pernah datang.
          if (e.buttons === 0) return this.onUp(e);
          const cur = { x: e.clientX, y: e.clientY, t: e.timeStamp };
          this.pointers.set(e.pointerId, cur);
          if (this.pointers.size === 2) {
            this.zoom((this.pinch.scale * this.pinchDistance()) / this.pinch.distance / this.scale);
            return;
          }
          if (this.pointers.size > 2) return;
          // Geseran kecil masih dianggap tap, supaya titik info tetap bisa dibuka.
          if (!this.el.sceneEl.is("gesture-moved")) {
            if (Math.hypot(cur.x - this.start.x, cur.y - this.start.y) < 10) return;
            this.el.sceneEl.addState("gesture-moved");
          }
          // Geser vertikal = putar di sumbu X (miring), geser horizontal = putar di sumbu Y.
          const rx = (cur.y - prev.y) * this.data.rotateSpeed;
          const ry = (cur.x - prev.x) * this.data.rotateSpeed;
          this.rotate(rx, ry);
          const dt = Math.max(cur.t - prev.t, 1);
          this.velocity = { x: 0.8 * (rx / dt) + 0.2 * this.velocity.x, y: 0.8 * (ry / dt) + 0.2 * this.velocity.y };
        },
        onUp(e) {
          const p = this.pointers.get(e.pointerId);
          if (!p) return;
          this.pointers.delete(e.pointerId);
          // Jari sudah diam sebelum diangkat, atau cubitan baru selesai: jangan lanjut berputar.
          if (e.timeStamp - p.t > 100 || this.pointers.size > 0) this.velocity = { x: 0, y: 0 };
        },
        onWheel(e) {
          if (!isShown(this.el)) return;
          e.preventDefault();
          this.zoom(Math.exp(-e.deltaY * 0.001));
        },
        tick(time, dt) {
          const v = this.velocity;
          if (this.pointers.size > 0 || (Math.abs(v.x) < 0.005 && Math.abs(v.y) < 0.005)) return;
          dt = Math.min(dt, 50);
          this.rotate(v.x * dt, v.y * dt);
          const friction = Math.pow(0.95, dt / 16);
          v.x *= friction;
          v.y *= friction;
        },
      });
    </script>
    <style>
      /* Matikan scroll/zoom bawaan browser di atas canvas supaya geseran dipakai untuk memutar model */
      .a-canvas { touch-action: none; }

      #hotspot-popup {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 24px;
        max-width: 420px;
        margin: 0 auto;
        padding: 16px 20px;
        border-radius: 12px;
        background: #fff;
        color: #222;
        font: 15px/1.5 sans-serif;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        z-index: 10000;
      }
      #hotspot-popup[hidden] { display: none; }
      #hotspot-popup h3 { margin: 0 0 6px; font-size: 18px; }
      #hotspot-popup p { margin: 0 0 12px; }
      #hotspot-popup button {
        padding: 8px 18px;
        border: 0;
        border-radius: 8px;
        background: #ff4d6d;
        color: #fff;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
	<img id="card" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" />
	<a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>
      </a-assets>

      <!-- cursor + raycaster: sentuhan/klik di layar diteruskan ke objek dengan class "clickable".
           Model ikut dicek supaya titik yang berada di balik model (saat diputar) tidak bisa diklik. -->
      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse" raycaster="far: 10000; objects: .clickable, a-gltf-model"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane src="#card" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane>
        <!-- Animasi naik-turun dipasang di pembungkus agar titik-titik ikut bergerak bersama model -->
        <a-entity animation="property: position; to: 0 0.1 0; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
          <!-- Pusat putar dan zoom di tengah model; isinya digeser balik agar posisi aslinya tidak berubah -->
          <a-entity position="0.05 0.35 0.1" model-gesture>
            <a-entity position="-0.05 -0.35 -0.1">
              <a-gltf-model rotation="0 0 0 " position="0 0 0.1" scale="0.005 0.005 0.005" src="#avatarModel"></a-gltf-model>

              <!-- Titik-titik info: ubah position, title, dan description sesuai kebutuhan.
                   z = 0.38 menaruh titik sedikit di depan permukaan model. -->
              <a-entity class="clickable" position="-0.16 0.5 0.38" hotspot="title: Topi; description: Tulis keterangan tentang topi di sini."></a-entity>
              <a-entity class="clickable" position="-0.45 0.3 0.38" hotspot="title: Kacamata; description: Tulis keterangan tentang kacamata di sini."></a-entity>
              <a-entity class="clickable" position="0.35 0.2 0.38" hotspot="title: Tulisan; description: Tulis keterangan tentang tulisan di sini."></a-entity>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-scene>

    <div id="hotspot-popup" hidden>
      <h3 id="hotspot-title"></h3>
      <p id="hotspot-description"></p>
      <button type="button" onclick="document.getElementById('hotspot-popup').hidden = true">Tutup</button>
    </div>
  </body>
</html>
